services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fizzbuzz_php
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: fizzbuzz_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
